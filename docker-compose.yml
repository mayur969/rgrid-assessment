services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin 
      MONGO_INITDB_ROOT_PASSWORD: admin@123
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    working_dir: /usr/src/app
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      MONGODB_URI: mongodb://admin:admin%40123@mongodb:27017/research_grid?authSource=admin
      JWT_SECRET: YOUR_JWT_SECRET_KEY
      SESSION_SECRET: YOUR_SESSION_SECRET_KEY
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URI: http://localhost:8080/api/v1
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  api_node_modules:
  client_node_modules:
